<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 700" width="540" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1621"/>
      <stop offset="1" stop-color="#17212b"/>
    </linearGradient>
  </defs>
  <rect width="540" height="700" rx="18" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="540" height="64" rx="18" fill="#17212b"/>
  <rect x="0" y="40" width="540" height="24" fill="#17212b"/>
  <circle cx="44" cy="32" r="18" fill="#3fb950"/>
  <text x="44" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">E</text>
  <text x="74" y="28" font-size="16" font-weight="600" fill="#ffffff">Expense Tracker Bot</text>
  <text x="74" y="47" font-size="13" fill="#6d7f8f">bot</text>

  <!-- User 1 -->
  <rect x="300" y="88" width="216" height="44" rx="14" fill="#2b5278"/>
  <text x="316" y="115" font-size="14" fill="#ffffff">lunch 45k and taxi 30k</text>

  <!-- Bot 1 -->
  <rect x="24" y="148" width="372" height="112" rx="14" fill="#182533"/>
  <text x="40" y="174" font-size="14" fill="#ffffff">Done! I recorded 2 expenses for today,</text>
  <text x="40" y="194" font-size="14" fill="#ffffff">23 Nov 2026:</text>
  <text x="40" y="218" font-size="14" fill="#d4dde6">Lunch, Food &amp; Drinks, IDR 45,000</text>
  <text x="40" y="240" font-size="14" fill="#d4dde6">Taxi, Transport, IDR 30,000 ✅</text>

  <!-- User 2 -->
  <rect x="236" y="280" width="280" height="44" rx="14" fill="#2b5278"/>
  <text x="252" y="307" font-size="14" fill="#ffffff">how much did I spend this week?</text>

  <!-- Bot 2 -->
  <rect x="24" y="340" width="372" height="114" rx="14" fill="#182533"/>
  <text x="40" y="366" font-size="14" fill="#ffffff">This week you spent IDR 312,000:</text>
  <text x="40" y="390" font-size="14" fill="#d4dde6">Food &amp; Drinks: IDR 187,000</text>
  <text x="40" y="412" font-size="14" fill="#d4dde6">Transport: IDR 95,000</text>
  <text x="40" y="434" font-size="14" fill="#d4dde6">Shopping: IDR 30,000 📊</text>

  <!-- User 3 -->
  <rect x="320" y="474" width="196" height="44" rx="14" fill="#2b5278"/>
  <text x="336" y="501" font-size="14" fill="#ffffff">change the taxi to 35k</text>

  <!-- Bot 3 -->
  <rect x="24" y="534" width="372" height="66" rx="14" fill="#182533"/>
  <text x="40" y="560" font-size="14" fill="#ffffff">Updated! Taxi, Transport, IDR 35,000</text>
  <text x="40" y="582" font-size="14" fill="#ffffff">on 23 Nov 2026 👍</text>

  <!-- Input bar -->
  <rect x="0" y="636" width="540" height="64" fill="#17212b"/>
  <rect x="0" y="636" width="540" height="1" fill="#0e1621"/>
  <text x="24" y="674" font-size="14" fill="#6d7f8f">Write a message…</text>
</svg>
